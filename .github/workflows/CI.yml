name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (MSVC, ${{ matrix.preset }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4

      # Puts cl, the Windows SDK (fxc for the live shaders), CMake and Ninja on PATH.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure

  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    # SDL3 is packaged from Ubuntu 25.04 on; the hosted runner images are older.
    container: ubuntu:26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ clang \
            libharfbuzz-dev libfontconfig-dev libunibreak-dev libfreetype-dev libsdl3-dev \
            fonts-noto-core fonts-noto-color-emoji \
            libegl1 libegl-mesa0 libgl1-mesa-dri

      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug

      # No display server: SDL's offscreen driver makes windows, and Mesa's llvmpipe renders them through EGL.
      - name: Test
        env:
          SDL_VIDEO_DRIVER: offscreen
          EGL_PLATFORM: surfaceless
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: ctest --test-dir build/linux-debug --output-on-failure
